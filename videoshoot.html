<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Klassik Frescobar — Video Shoot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --black:  #06060a;
    --deep:   #0d0d14;
    --violet: #6b21d6;
    --neon:   #c855ff;
    --pink:   #ff3d8a;
    --white:  #f0ecff;
    --text:   #a09ab8;
    --border: #1e1a2e;
    --radius: 12px;
    --glow:   0 0 20px rgba(200,85,255,0.25);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: 'Space Grotesk', sans-serif;
    background: var(--black);
    color: var(--white);
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(107,33,214,.35) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 80% 80%,  rgba(200,85,255,.08) 0%, transparent 60%);
  }

  .card {
    background: var(--deep);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 36px 44px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 24px 64px rgba(0,0,0,.6), 0 0 0 1px rgba(107,33,214,.15);
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--violet), var(--neon), var(--pink));
    border-radius: 20px 20px 0 0;
  }

  /* Logos */
  .logos {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    margin-bottom: 24px;
  }
  .logo-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    flex: 1;
  }
  .logo-img {
    width: 110px;
    height: 110px;
    object-fit: contain;
  }
  .logo-img.kf { filter: drop-shadow(0 0 14px rgba(200,85,255,.35)); }
  .logo-img.cw { filter: drop-shadow(0 0 8px  rgba(107,33,214,.4));  }
  .logo-label {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: .12em;
    color: var(--text);
    text-transform: uppercase;
    text-align: center;
  }
  .logo-divider {
    width: 1px;
    height: 80px;
    flex-shrink: 0;
    background: linear-gradient(to bottom, transparent, var(--border), transparent);
  }

  /* Header */
  .header { text-align: center; margin-bottom: 28px; }
  .headline {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 58px;
    line-height: 1;
    letter-spacing: .1em;
    background: linear-gradient(135deg, var(--white) 0%, var(--neon) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }
  .subtitle {
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  /* Badges */
  .badges {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 4px 10px 4px 8px;
    border-radius: 999px;
    border: 1px solid;
  }
  .badge.on  { color: #4ade80; border-color: rgba(74,222,128,.25); background: rgba(74,222,128,.06); }
  .badge.off { color: #facc15; border-color: rgba(250,204,21,.25);  background: rgba(250,204,21,.06); }
  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
  }
  .badge.on .dot { animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.8)} }

  /* Form */
  .form-group { margin-bottom: 18px; }
  label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--text);
    margin-bottom: 7px;
  }
  label .req { color: var(--neon); margin-left: 2px; }

  input, select {
    width: 100%;
    background: rgba(255,255,255,.04);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--white);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 16px;
    padding: 14px 16px;
    outline: none;
    transition: border-color .2s, box-shadow .2s, background .2s;
    -webkit-appearance: none;
    appearance: none;
  }
  input::placeholder { color: rgba(160,154,184,.4); }
  select { cursor: pointer; }
  select option { background: #1a1428; color: var(--white); }

  input:focus, select:focus {
    border-color: var(--violet);
    box-shadow: 0 0 0 3px rgba(107,33,214,.2);
    background: rgba(107,33,214,.06);
  }
  input.error { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(255,61,138,.15); }
  input.valid { border-color: rgba(74,222,128,.4); }

  .err {
    font-size: 11px;
    color: var(--pink);
    margin-top: 5px;
    display: none;
    align-items: center;
    gap: 4px;
  }
  .err.show { display: flex; }
  .err::before { content: '⚠'; font-size: 10px; }

  .social-row {
    display: grid;
    grid-template-columns: 145px 1fr;
    gap: 10px;
  }

  /* Submit */
  .btn-submit {
    width: 100%;
    margin-top: 8px;
    padding: 17px;
    background: linear-gradient(135deg, var(--violet), var(--neon));
    border: none;
    border-radius: var(--radius);
    color: #fff;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    letter-spacing: .12em;
    cursor: pointer;
    transition: opacity .2s, transform .15s, box-shadow .2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    box-shadow: 0 4px 24px rgba(107,33,214,.45);
    -webkit-tap-highlight-color: transparent;
  }
  .btn-submit:hover:not(:disabled) { opacity:.92; transform:translateY(-1px); box-shadow:0 8px 32px rgba(107,33,214,.55); }
  .btn-submit:active:not(:disabled) { transform:translateY(0); opacity:.85; }
  .btn-submit:disabled { opacity:.6; cursor:not-allowed; transform:none; }

  .spinner {
    width: 20px; height: 20px;
    border: 2.5px solid rgba(255,255,255,.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    display: none;
  }
  .btn-submit.loading .spinner { display: block; }
  .btn-submit.loading .btn-text { opacity: .7; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Success */
  #success { display: none; text-align: center; padding: 16px 0; animation: fadein .35s ease; }
  @keyframes fadein { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
  .success-icon {
    width: 76px; height: 76px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--violet), var(--neon));
    display: flex; align-items: center; justify-content: center;
    font-size: 34px;
    margin: 0 auto 24px;
    box-shadow: var(--glow);
    animation: popin .4s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes popin { from{transform:scale(.4);opacity:0} to{transform:scale(1);opacity:1} }
  .success-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 42px;
    letter-spacing: .06em;
    background: linear-gradient(135deg, var(--white), var(--neon));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
  }
  .success-msg { font-size: 14px; color: var(--text); line-height: 1.7; margin-bottom: 32px; }
  .btn-reset {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 13px 28px;
    background: transparent;
    border: 1px solid var(--violet);
    border-radius: var(--radius);
    color: var(--neon);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s, box-shadow .2s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-reset:hover { background: rgba(107,33,214,.15); box-shadow: var(--glow); }

  @media (max-width: 500px) {
    .card { padding: 28px 18px 36px; border-radius: 16px; }
    .headline { font-size: 48px; }
    .logo-img { width: 90px; height: 90px; }
    .social-row { grid-template-columns: 1fr; }
  }
</style>
</head>

<script>
// ╔══════════════════════════════════════════════════════════════════╗
// ║  CONFIGURATION — update these two values before going live       ║
// ╠══════════════════════════════════════════════════════════════════╣
const AIRTABLE_KEY      = 'YOUR_AIRTABLE_API_KEY_HERE';
const AIRTABLE_BASE     = 'appQGDHpsb00e1YkO';
const AIRTABLE_TABLE    = 'tbljSM157TQA6W9go';   // Contacts table
const GOOGLE_SHEETS_URL = 'YOUR_GOOGLE_SHEETS_WEBAPP_URL_HERE';
// ╚══════════════════════════════════════════════════════════════════╝

// Show Sheets badge as active only when URL is configured
if (GOOGLE_SHEETS_URL && !GOOGLE_SHEETS_URL.startsWith('YOUR_')) {
  const b = document.getElementById('badge-gs');
  b.classList.replace('off','on');
}

const form     = document.getElementById('form');
const btn      = document.getElementById('btn');
const btnText  = btn.querySelector('.btn-text');
const success  = document.getElementById('success');
const btnReset = document.getElementById('btn-reset');

const fName     = document.getElementById('f-name');
const fEmail    = document.getElementById('f-email');
const fPhone    = document.getElementById('f-phone');
const fHandle   = document.getElementById('f-handle');
const fPlatform = document.getElementById('f-platform');

// ── Validation ──────────────────────────────────────────────────────
function err(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.classList.toggle('show', !!msg);
}
function mark(input, bad) {
  input.classList.toggle('error', bad);
  input.classList.toggle('valid', !bad && input.value.trim() !== '');
}

const rules = [
  [fName,   'e-name',  () => fName.value.trim().length >= 2,         'Please enter your full name.'],
  [fEmail,  'e-email', () => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(fEmail.value.trim()), 'Enter a valid email address.'],
  [fPhone,  'e-phone', () => fPhone.value.trim().replace(/\D/g,'').length >= 7,       'Enter a valid phone number.'],
  [fHandle, 'e-social',() => fHandle.value.trim().length >= 1,       'Enter your social media handle.'],
];

function validate(rule) {
  const [input, errId, check, msg] = rule;
  const ok = check();
  mark(input, !ok);
  err(errId, ok ? '' : msg);
  return ok;
}
function validateAll() { return rules.map(r => validate(r)).every(Boolean); }

rules.forEach(([input, errId]) => {
  input.addEventListener('blur', () => {
    const rule = rules.find(r => r[0] === input);
    validate(rule);
  });
  input.addEventListener('input', () => {
    if (input.classList.contains('error')) {
      const rule = rules.find(r => r[0] === input);
      validate(rule);
    }
  });
});

// ── Enter-key navigation ────────────────────────────────────────────
const order = [fName, fEmail, fPhone, fPlatform, fHandle];
order.forEach((el, i) => {
  el.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    i < order.length - 1 ? order[i+1].focus() : btn.click();
  });
});

// ── Submit ──────────────────────────────────────────────────────────
form.addEventListener('submit', async e => {
  e.preventDefault();
  if (!validateAll()) return;

  btn.disabled = true;
  btn.classList.add('loading');
  btnText.textContent = 'Saving…';

  const firstName = fName.value.trim().split(' ')[0];
  const platform  = fPlatform.value;
  const handle    = fHandle.value.trim();

  const data = {
    fullName:   fName.value.trim(),
    email:      fEmail.value.trim(),
    phone:      fPhone.value.trim(),
    platform,
    handle,
    notes:      platform + ': ' + handle,
    leadSource: 'Klassik Frescobar Video Shoot',
    timestamp:  new Date().toISOString(),
  };

  await Promise.allSettled([
    toAirtable(data),
    toSheets(data),
  ]);

  form.style.display = 'none';
  document.getElementById('s-name').textContent = "YOU'RE IN, " + firstName.toUpperCase() + "!";
  success.style.display = 'block';
});

// ── Reset ───────────────────────────────────────────────────────────
btnReset.addEventListener('click', () => {
  success.style.display = 'none';
  form.style.display = 'block';
  btn.disabled = false;
  btn.classList.remove('loading');
  btnText.textContent = 'SIGN IN';
  form.reset();
  [fName, fEmail, fPhone, fHandle].forEach(f => f.classList.remove('error','valid'));
  rules.forEach(([,errId]) => err(errId, ''));
  setTimeout(() => fName.focus(), 50);
});

// ── Airtable ────────────────────────────────────────────────────────
async function toAirtable(d) {
  if (!AIRTABLE_KEY || AIRTABLE_KEY.startsWith('YOUR_')) return;
  const res = await fetch('https://api.airtable.com/v0/' + AIRTABLE_BASE + '/' + AIRTABLE_TABLE, {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + AIRTABLE_KEY,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({ fields: {
      'Full Name':    d.fullName,
      'Email':        d.email,
      'Phone Number': d.phone,
      'Lead Source':  d.leadSource,
      'Notes':        d.notes,
    } }),
  });
  if (!res.ok) console.warn('Airtable error:', await res.text());
}

// ── Google Sheets ────────────────────────────────────────────────────
async function toSheets(d) {
  if (!GOOGLE_SHEETS_URL || GOOGLE_SHEETS_URL.startsWith('YOUR_')) return;
  const params = new URLSearchParams({
    fullName:   d.fullName,
    email:      d.email,
    phone:      d.phone,
    platform:   d.platform,
    handle:     d.handle,
    leadSource: d.leadSource,
    timestamp:  d.timestamp,
  });
  await fetch(GOOGLE_SHEETS_URL + '?' + params, { mode: 'no-cors' });
}
</script>
